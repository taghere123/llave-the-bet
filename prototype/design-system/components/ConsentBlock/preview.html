<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"><style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--surface);color:var(--text);font-family:var(--font-sans)}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
a.lk{font-family:var(--font-sans);font-size:14px;font-weight:700;color:var(--action);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.chev{width:8px;height:8px;border-right:2px solid currentColor;border-top:2px solid currentColor;transform:rotate(45deg)}

.cb{width:380px;background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-md);padding:24px;display:flex;flex-direction:column;gap:16px}
.h{font-family:var(--font-display);font-size:20px;line-height:24px;font-weight:500;margin:0}.p{font-size:14px;line-height:20px;margin:0}
.ck{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:20px}.bx{flex:none;width:22px;height:22px;border:2px solid var(--border-strong);border-radius:3px;background:var(--surface)}.on .bx{background:var(--action);border-color:var(--action)}
.on .bx:after{content:"";display:block;width:6px;height:11px;border-right:2px solid var(--on-action);border-bottom:2px solid var(--on-action);transform:rotate(40deg);margin:2px 0 0 6px}
.bt{height:var(--size-control-md);border:0;border-radius:var(--radius-sm);background:var(--action);color:var(--on-action);font-family:var(--font-display);font-size:16px;font-weight:700}
</style></head><body><div class="cb"><h4 class="h">Autoriza la evaluación de tus datos</h4><p class="p">El propietario recibirá solo tu score y tu capacidad de pago. No verá tus movimientos ni tus saldos.</p><label class="ck on"><i class="bx"></i><span>Autorizo a Interbank a consultar mis datos financieros para calcular mi RentScore.</span></label><button class="bt">Autorizar y continuar</button><a class="lk" href="#">Política de tratamiento de datos <span class="chev"></span></a></div></body></html>
