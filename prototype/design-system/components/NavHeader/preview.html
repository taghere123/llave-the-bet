<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"><style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--surface);color:var(--text);font-family:var(--font-sans)}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
a.lk{font-family:var(--font-sans);font-size:14px;font-weight:700;color:var(--action);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.chev{width:8px;height:8px;border-right:2px solid currentColor;border-top:2px solid currentColor;transform:rotate(45deg)}

body{padding:0}.hd{height:var(--size-header);background:var(--surface);box-shadow:var(--shadow-header);display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 24px}
.lg{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:20px;color:var(--brand-deep)}.lg small{display:block;font-size:11px;letter-spacing:.8px;color:var(--text-muted);text-transform:uppercase}
nav{display:flex;gap:24px;flex-wrap:wrap}nav a{font-size:13px;line-height:16px;font-weight:500;color:var(--text);text-decoration:none;max-width:130px}
.cta{height:var(--size-control-lg);padding:0 24px;border-radius:var(--radius-pill);background:var(--action);color:var(--on-action);font-family:var(--font-display);font-size:16px;font-weight:700;border:0}
</style></head><body><header class="hd"><div class="lg">LLAVE<small>Hogares que abren oportunidades</small></div><nav><a href="#">Mis inmuebles</a><a href="#">Postulantes</a><a href="#">Mi Cuenta Arrendador</a></nav><button class="cta">Publicar inmueble</button></header></body></html>
