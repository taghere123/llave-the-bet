<!-- @dsCard group="Contenido" height=430 subtitle="Tarjeta de inmueble con forma firma" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"><style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--surface);color:var(--text);font-family:var(--font-sans)}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
a.lk{font-family:var(--font-sans);font-size:14px;font-weight:700;color:var(--action);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.chev{width:8px;height:8px;border-right:2px solid currentColor;border-top:2px solid currentColor;transform:rotate(45deg)}

.card{width:264px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-signature) 0;box-shadow:var(--shadow-card);overflow:hidden}
.img{position:relative;height:160px;background:linear-gradient(135deg,var(--azul-900),var(--azul-600))}
.tag{position:absolute;top:0;right:0;background:var(--yellow-400);color:var(--ink);font-size:11px;line-height:16px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:6px 16px}
.bd{padding:16px 24px 24px;display:flex;flex-direction:column;gap:4px}
.dev{font-size:10px;line-height:14px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted)}
.nm{font-family:var(--font-display);font-size:20px;line-height:24px;font-weight:500;margin:4px 0 0}.ds{font-size:12px;color:var(--text-muted)}
.fin{margin-top:16px;font-size:12px;line-height:16px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--link)}
.pr{font-family:var(--font-display);font-size:20px;line-height:24px;font-weight:600}.sm{font-size:12px;color:var(--text)}
</style></head><body><div class="card"><div class="img"><span class="tag">Con postulantes</span></div><div class="bd"><span class="dev">Departamento en alquiler</span><h4 class="nm">Av. Arequipa 2450</h4><span class="ds">Lince, Lima</span><span class="fin">Renta mensual</span><span class="sm">desde</span><span class="pr">S/2,400</span><a class="lk" href="#" style="margin-top:8px">Ver postulantes <span class="chev"></span></a></div></div></body></html>
