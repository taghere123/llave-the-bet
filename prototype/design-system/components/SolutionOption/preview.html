<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"><style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--surface);color:var(--text);font-family:var(--font-sans)}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
a.lk{font-family:var(--font-sans);font-size:14px;font-weight:700;color:var(--action);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.chev{width:8px;height:8px;border-right:2px solid currentColor;border-top:2px solid currentColor;transform:rotate(45deg)}

.o{display:flex;gap:16px;width:360px;padding:16px 24px;background:var(--surface);border:2px solid var(--border-strong);border-radius:var(--radius-signature) 0;margin-bottom:16px;align-items:flex-start}
.o.sel{border-color:var(--action);background:var(--surface-raised)}
.rd{flex:none;width:20px;height:20px;border:2px solid var(--border-strong);border-radius:50%;margin-top:2px}.sel .rd{border-color:var(--action);background:radial-gradient(var(--action) 45%,transparent 50%)}
.t{font-family:var(--font-display);font-size:20px;line-height:24px;font-weight:500;margin:0}.d{font-size:14px;line-height:20px;margin:4px 0 8px}.p{font-family:var(--font-display);font-weight:600;font-size:16px}
.soon{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div class="o sel"><i class="rd"></i><div><h4 class="t">RentScore Seguro</h4><p class="d">Reemplaza la garantía de dos meses. La prima la paga el inquilino.</p><span class="p">Prima mensual referencial</span></div></div><div class="o"><i class="rd"></i><div><h4 class="t">Cobro Garantizado</h4><p class="d">Recibes la renta cada mes en tu Cuenta Arrendador.</p><span class="p">Comisión por definir</span></div></div></body></html>
