<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"><style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--surface);color:var(--text);font-family:var(--font-sans)}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
a.lk{font-family:var(--font-sans);font-size:14px;font-weight:700;color:var(--action);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.chev{width:8px;height:8px;border-right:2px solid currentColor;border-top:2px solid currentColor;transform:rotate(45deg)}

body{padding:0}.band{background:var(--azul-900);padding:32px 16px;display:flex;justify-content:center}
.f{display:flex;flex-wrap:wrap;gap:8px;width:100%;max-width:640px}
.sel{flex:1 1 200px;height:var(--size-field);background:#fff;color:var(--ink);border:0;border-radius:0;padding:0 12px;font-family:var(--font-sans);font-size:16px;display:flex;align-items:center;justify-content:space-between}
.sel:after{content:"";width:6px;height:6px;border-right:2px solid var(--gray-500);border-bottom:2px solid var(--gray-500);transform:rotate(45deg)}
.go{height:var(--size-control-md);padding:0 32px;border:0;border-radius:var(--radius-sm);background:var(--green-500);color:var(--ink);font-family:var(--font-display);font-size:16px;font-weight:700}
</style></head><body><div class="band"><div class="f"><div class="sel">Distrito</div><div class="sel">Estado</div><button class="go">Buscar</button></div></div></body></html>
