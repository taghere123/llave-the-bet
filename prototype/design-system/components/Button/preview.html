<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"><style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--surface);color:var(--text);font-family:var(--font-sans)}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
a.lk{font-family:var(--font-sans);font-size:14px;font-weight:700;color:var(--action);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.chev{width:8px;height:8px;border-right:2px solid currentColor;border-top:2px solid currentColor;transform:rotate(45deg)}

.btn{font-family:var(--font-display);font-size:16px;line-height:24px;font-weight:700;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--action);color:var(--on-action)}
.btn.md{height:var(--size-control-md);padding:0 32px;border-radius:var(--radius-sm)}
.btn.lg{height:var(--size-control-lg);padding:0 24px;border-radius:var(--radius-pill)}
.btn.sec{background:transparent;color:var(--action);box-shadow:inset 0 0 0 2px var(--action)}
.btn:disabled{background:var(--border);color:var(--text-muted);cursor:not-allowed}
.doc{width:14px;height:18px;border:2px solid currentColor;border-radius:2px}
</style></head><body><div class="row"><button class="btn md">Buscar proyectos</button><button class="btn lg"><span class="doc"></span>Déjanos tus datos</button><button class="btn md sec">Ver detalle</button><button class="btn md" disabled>Solicitar RentScore</button><a class="lk" href="#">Conócelo <span class="chev"></span></a></div></body></html>
