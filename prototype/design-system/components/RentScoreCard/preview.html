<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"><style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--surface);color:var(--text);font-family:var(--font-sans)}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
a.lk{font-family:var(--font-sans);font-size:14px;font-weight:700;color:var(--action);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.chev{width:8px;height:8px;border-right:2px solid currentColor;border-top:2px solid currentColor;transform:rotate(45deg)}

.sc{width:340px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-signature) 0;box-shadow:var(--shadow-card);padding:24px;display:flex;flex-direction:column;gap:16px}
.eye{font-size:12px;line-height:16px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--link)}
.g{position:relative;width:200px;height:110px;align-self:center}.g svg{width:200px;height:110px}
.num{position:absolute;left:0;right:0;bottom:0;text-align:center;font-family:var(--font-display);font-size:40px;line-height:44px;font-weight:500}
.lab{align-self:center;background:var(--yellow-400);color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:6px 16px}
.k{display:flex;justify-content:space-between;font-size:14px;line-height:20px;border-top:1px solid var(--border);padding-top:12px}.k b{font-family:var(--font-display);font-weight:600}
.n{font-size:12px;line-height:16px;color:var(--text-muted);margin:0}
</style></head><body><div class="sc"><span class="eye">RentScore del postulante</span><div class="g"><svg viewBox="0 0 200 110" aria-hidden="true"><path d="M10 100 A90 90 0 0 1 190 100" fill="none" stroke="var(--border)" stroke-width="14"/><path d="M10 100 A90 90 0 0 1 149 24" fill="none" stroke="var(--yellow-400)" stroke-width="14"/></svg><div class="num">68<span style="font-size:16px;color:var(--text-muted)"> / 100</span></div></div><span class="lab">Score medio</span><div class="k"><span>Capacidad de pago recomendada</span><b>S/2,600</b></div><div class="k"><span>Renta del inmueble</span><b>S/2,400</b></div><p class="n">Ejemplo con datos ficticios. El postulante autorizó la consulta de sus datos el 25/09/2026.</p></div></body></html>
